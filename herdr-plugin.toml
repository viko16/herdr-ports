# herdr plugin manifest - install with:
#   herdr plugin install viko16/herdr-ports
# Local dev: herdr plugin link /path/to/herdr-ports
id = "viko16.herdr-ports"
name = "Ports"
version = "0.2.0"
description = "Listening services started by each Space: sidebar badge and port list"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Watcher autostart: every pane creation cheaply re-checks the singleton, so
# the badge poller is alive whenever herdr is actually in use - no LaunchAgent,
# no entrypoint wiring. It dies with the machine, not with herdr, which is fine:
# it no-ops (and posts nothing) while the herdr server is down.
[[events]]
on = "pane.created"
command = ["./herdr-ports", "ensure-watch"]
